<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <title>Birthdays</title>
    </head>
    <body>
        <div class="header">
            <h1>Birthdays</h1>
        </div>

        <div class="container">

            <!-- بخش افزودن تولد جدید -->
            <div class="section">
                <h2>Add a Birthday</h2>

                <!-- ✅ فرم ارسال اطلاعات به / با روش POST -->
                <form action="/" method="post">
                    <input name="name" type="text" placeholder="Name" required>
                    <input name="month" type="number" placeholder="Month" min="1" max="12" required>
                    <input name="day" type="number" placeholder="Day" min="1" max="31" required>
                    <input type="submit" value="Add Birthday">
                </form>
            </div>

            <!-- بخش نمایش تمام تولدها -->
            <div class="section">
                <h2>All Birthdays</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- ✅ حلقه Jinja برای نمایش داده‌ها -->
                        {% for birthday in birthdays %}
                            <tr>
                                <td>{{ birthday.name }}</td>
                                <td>{{ birthday.month }}/{{ birthday.day }}</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
